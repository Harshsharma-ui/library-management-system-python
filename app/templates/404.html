{% extends "base.html" %}

{% block title %}404 Not Found - Granthify{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-warning p-4">
                <div class="card-body">
                    <div class="text-warning mb-3">
                        <i class="bi bi-question-circle-fill" style="font-size: 4rem;"></i>
                    </div>
                    <h1 class="display-5 fw-bold text-dark">404 - Resource Not Found</h1>
                    <p class="lead text-muted mt-3">
                        The requested URL or record could not be found on the server.
                    </p>
                    <div class="mt-4">
                        <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary px-4 py-2">
                            <i class="bi bi-house-door me-1"></i> Return Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
